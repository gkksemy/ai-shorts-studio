<!DOCTYPE html>
<html>
<head>
<title>AI Shorts Studio</title>

<style>
body {
font-family: Arial, sans-serif;
max-width: 700px;
margin: 60px auto;
padding: 20px;
text-align: center;
}

textarea {
width: 100%;
height: 120px;
padding: 15px;
font-size: 16px;
box-sizing: border-box;
margin: 20px 0;
}

button {
padding: 14px 30px;
font-size: 16px;
cursor: pointer;
}

#result {
margin-top: 30px;
text-align: left;
white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>🎬 AI Shorts Studio</h1>

<p>Turn your idea into a short-video script.</p>

<textarea id="idea" placeholder="Describe your video idea..."></textarea>

<br><br>

<button onclick="generateScript()">Create Video</button>

<div id="result"></div>

<script>
async function generateScript() {
  const idea = document.getElementById("idea").value;
  const result = document.getElementById("result");

  if (!idea.trim()) {
    result.innerText = "Please enter a video idea first.";
    return;
  }

  result.innerText = "🎬 Creating your video script...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ idea: idea })
    });

    const data = await response.json();

    if (!response.ok) {
      result.innerText =
        "❌ Error: " + (data.error || "Something went wrong.");
      return;
    }

    result.innerText =
      "🎬 Your AI-generated script:\n\n" +
      data.script;

  } catch (error) {
    result.innerText =
      "❌ Could not connect to the AI generator.\n\n" +
      error.message;
  }
}
</script>
</body>
</html>
