<!DOCTYPE html>
<html>
<head>
  <title>AI Shorts Studio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
      background: #f7f7f7;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      box-sizing: border-box;
      margin: 20px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    select {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }

    button {
      padding: 14px 30px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
      text-align: left;
      white-space: pre-wrap;
    }

    video {
      width: 100%;
      max-width: 400px;
      margin-top: 25px;
      border-radius: 10px;
    }

    .status {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>🎬 AI Shorts Studio</h1>

  <p>Turn your idea into a 30-second AI video.</p>

  <textarea
    id="idea"
    placeholder="Describe your video idea..."
  ></textarea>

  <br>

  <label for="style">
    <strong>Choose your video style:</strong>
  </label>

  <select id="style">
    <option value="cartoon">🎨 Cartoon / Animated</option>
    <option value="realistic">🎬 Realistic</option>
  </select>

  <br><br>

  <button id="createButton" onclick="createVideo()">
    🎬 Create Video
  </button>

  <div id="result"></div>

  <script>

    async function createVideo() {

      const idea = document.getElementById("idea").value.trim();
      const style = document.getElementById("style").value;
      const button = document.getElementById("createButton");
      const result = document.getElementById("result");

      if (!idea) {
        result.innerText = "❌ Please enter a video idea first.";
        return;
      }

      button.disabled = true;

      try {

        // STEP 1
        result.innerText =
          "🤖 Creating your 6-scene story...";

        const sceneResponse = await fetch("/api/scenes", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idea: idea,
            style: style
          })
        });

        const sceneData = await sceneResponse.json();

        if (!sceneResponse.ok) {
          throw new Error(
            sceneData.error || "Could not create scenes."
          );
        }

        if (
          !sceneData.scenes ||
          sceneData.scenes.length !== 6
        ) {
          throw new Error(
            "The AI did not create exactly 6 scenes."
          );
        }

        // STEP 2
        result.innerText =
          "🎬 Sending 6 scenes to Runway...\n\n" +
          "This may take several minutes.";

        const createResponse = await fetch(
          "/api/create-short",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              scenes: sceneData.scenes
            })
          }
        );

        const createData = await createResponse.json();

        if (!createResponse.ok) {
          throw new Error(
            createData.error ||
            "Could not start video generation."
          );
        }

        const taskIds = createData.tasks
          ? createData.tasks.map(item => item.taskId)
          : createData.taskIds;

        if (!taskIds || taskIds.length !== 6) {
          throw new Error(
            "Runway did not return 6 task IDs."
          );
        }

        // STEP 3
        let videos = null;

        while (!videos) {

          result.innerText =
            "🎥 Runway is generating your 6 clips...\n\n" +
            "Please wait. Do not close this page.";

          await new Promise(resolve =>
            setTimeout(resolve, 10000)
          );

          const statusResponse = await fetch(
            "/api/short-status",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                taskIds: taskIds
              })
            }
          );

          const statusData =
            await statusResponse.json();

          if (!statusResponse.ok) {
            throw new Error(
              statusData.error ||
              "Could not check video status."
            );
          }

          if (statusData.status === "FAILED") {
            throw new Error(
              "One or more Runway clips failed."
            );
          }

          if (statusData.status === "SUCCEEDED") {

            videos = statusData.videos;

            if (
              !videos ||
              videos.length !== 6 ||
              videos.some(video => !video)
            ) {
              throw new Error(
                "Runway finished, but some video URLs are missing."
              );
            }
          }
        }

        // STEP 4
        result.innerText =
          "✂️ Combining the 6 clips into one 30-second video...";

        const stitchResponse = await fetch(
          "/api/stitch",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              videos: videos
            })
          }
        );

        const stitchData =
          await stitchResponse.json();

        if (!stitchResponse.ok) {
          throw new Error(
            stitchData.error ||
            "Could not start video assembly."
          );
        }

        const renderId = stitchData.renderId;

        if (!renderId) {
          throw new Error(
            "Shotstack did not return a render ID."
          );
        }

        // STEP 5
        let finalVideo = null;

        while (!finalVideo) {

          result.innerText =
            "🎞️ Finalizing your 30-second video...";

          await new Promise(resolve =>
            setTimeout(resolve, 5000)
          );

          const renderResponse = await fetch(
            "/api/stitch-status?renderId=" +
            encodeURIComponent(renderId)
          );

          const renderData =
            await renderResponse.json();

          if (!renderResponse.ok) {
            throw new Error(
              renderData.error ||
              "Could not check final video."
            );
          }

          if (
            renderData.status === "failed" ||
            renderData.status === "ERROR"
          ) {
            throw new Error(
              "Shotstack failed to create the final video."
            );
          }

          if (
            renderData.status === "done" &&
            renderData.url
          ) {
            finalVideo = renderData.url;
          }
        }

        // STEP 6
        result.innerHTML = `
          <h2>🎉 Your video is ready!</h2>

          <video controls autoplay>
            <source
              src="${finalVideo}"
              type="video/mp4"
            >
          </video>

          <p>
            🎬 30-second AI Short completed!
          </p>
        `;

      } catch (error) {

        result.innerText =
          "❌ " + error.message;

      } finally {

        button.disabled = false;
      }
    }

  </script>

</body>
</html>
