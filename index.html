<!DOCTYPE html>
<html>
<head>
  <title>AI Shorts Studio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
      background: #f7f7f7;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      box-sizing: border-box;
      margin: 20px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    select {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }

    button {
      padding: 14px 30px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
      text-align: center;
    }

    video {
      width: 100%;
      max-width: 400px;
      margin-top: 25px;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>

<body>

  <h1>🎬 AI Shorts Studio</h1>

  <p>Test your 30-second AI Short.</p>

  <textarea
    id="idea"
    placeholder="Describe your video idea..."
  ></textarea>

  <br>

  <label for="style">
    <strong>Choose your video style:</strong>
  </label>

  <select id="style">
    <option value="cartoon">🎨 Cartoon / Animated</option>
    <option value="realistic">🎬 Realistic</option>
  </select>

  <br><br>

  <button id="createButton" onclick="createTestVideo()">
    🎬 Create Test Video
  </button>

  <div id="result"></div>

  <script>

    const existingTaskIds = [
      "3fdb6cbd-1498-4c0c-9632-0ff25808e4ba",
      "46b21bd5-4c91-4cc2-8858-931b5c78f273",
      "2ad6b96e-f90f-4131-a6e8-9d8da88d8ded",
      "085784de-972f-4e68-9165-dc99e873fb4d",
      "46d7d4af-7223-4156-a9a2-63dce2f9be86",
      "03d72134-f2ec-4d23-854c-6e0f3f7dba8c"
    ];

    async function createTestVideo() {

      const button =
        document.getElementById("createButton");

      const result =
        document.getElementById("result");

      button.disabled = true;

      try {

        // STEP 1 — GET EXISTING RUNWAY VIDEOS

        result.innerHTML =
          "🎬 Loading your existing 6 video clips...<br><br>" +
          "No new Runway credits will be used.";

        const statusResponse =
          await fetch(
            "/api/short-status",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                taskIds: existingTaskIds
              })
            }
          );

        const statusData =
          await statusResponse.json();

        if (!statusResponse.ok) {
          throw new Error(
            statusData.error ||
            "Could not load the existing clips."
          );
        }

        if (
          statusData.status !== "SUCCEEDED"
        ) {
          throw new Error(
            "The existing Runway clips are not all finished."
          );
        }

        const videos =
          statusData.videos;

        if (
          !Array.isArray(videos) ||
          videos.length !== 6 ||
          videos.some(video => !video)
        ) {
          throw new Error(
            "Six completed video URLs were not found."
          );
        }

        // STEP 2 — SEND EXISTING CLIPS TO SHOTSTACK

        result.innerHTML =
          "✂️ Combining your 6 existing clips...<br><br>" +
          "Creating your 30-second video.";

        const stitchResponse =
          await fetch(
            "/api/stitch",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                videos: videos
              })
            }
          );

        const stitchData =
          await stitchResponse.json();

        if (!stitchResponse.ok) {
          throw new Error(
            stitchData.error ||
            "Could not start Shotstack."
          );
        }

        const renderId =
          stitchData.renderId;

        if (!renderId) {
          throw new Error(
            "Shotstack did not return a render ID."
          );
        }

        // STEP 3 — WAIT FOR SHOTSTACK

        let finalVideo = null;

        while (!finalVideo) {

          result.innerHTML =
            "🎞️ Shotstack is creating your final video...<br><br>" +
            "Almost there.";

          await sleep(5000);

          const renderResponse =
            await fetch(
              "/api/stitch-status?renderId=" +
              encodeURIComponent(renderId)
            );

          const renderData =
            await renderResponse.json();

          if (!renderResponse.ok) {
            throw new Error(
              renderData.error ||
              "Could not check Shotstack."
            );
          }

          const status =
            String(
              renderData.status || ""
            ).toLowerCase();

          if (
            status === "failed" ||
            status === "error"
          ) {
            throw new Error(
              "Shotstack failed to create the video."
            );
          }

          if (
            status === "done" &&
            renderData.url
          ) {
            finalVideo =
              renderData.url;
          }
        }

        // STEP 4 — DISPLAY VIDEO

        result.innerHTML = `
          <h2>🎉 Your 30-second video is ready!</h2>

          <video
            controls
            autoplay
            playsinline
          >
            <source
              src="${finalVideo}"
              type="video/mp4"
            >
            Your browser does not support video playback.
          </video>

          <p>
            ✅ Test completed successfully.
          </p>
        `;

      } catch (error) {

        console.error(error);

        result.innerHTML =
          "❌ " + error.message;

      } finally {

        button.disabled = false;
      }
    }

    function sleep(milliseconds) {
      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            milliseconds
          )
      );
    }

  </script>

</body>
</html>
