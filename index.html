<!DOCTYPE html>
<html>
<head>
  <title>AI Shorts Studio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      box-sizing: border-box;
      margin: 20px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
    }

    select {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 6px;
    }

    button {
      padding: 14px 30px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
      text-align: center;
      white-space: pre-wrap;
    }

    video {
      width: 100%;
      max-width: 400px;
      margin-top: 25px;
      border-radius: 10px;
      background: black;
    }

    .status {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1>🎬 AI Shorts Studio</h1>

  <p>Turn your idea into a 30-second AI video.</p>

  <textarea
    id="idea"
    placeholder="Describe your video idea..."
  ></textarea>

  <br>

  <label for="style">
    <strong>Choose your video style:</strong>
  </label>

  <select id="style">
    <option value="cartoon">🎨 Cartoon / Animated</option>
    <option value="realistic">🎬 Realistic</option>
  </select>

  <br>

  <button id="createButton" onclick="createVideo()">
    🎬 Create Video
  </button>

  <div id="result"></div>

  <script>

    async function createVideo() {

      const idea =
        document.getElementById("idea").value.trim();

      const style =
        document.getElementById("style").value;

      const button =
        document.getElementById("createButton");

      const result =
        document.getElementById("result");

      if (!idea) {
        result.innerText =
          "❌ Please enter a video idea first.";
        return;
      }

      button.disabled = true;

      try {

        // ==========================================
        // STEP 1 — CREATE 6 SCENES
        // ==========================================

        result.innerText =
          "🤖 Creating your 6-scene story...\n\n" +
          "Please wait...";

        const sceneResponse = await fetch(
          "/api/scenes",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              idea: idea,
              style: style
            })
          }
        );

        const sceneData =
          await sceneResponse.json();

        if (!sceneResponse.ok) {
          throw new Error(
            sceneData.error ||
            "Could not create scenes."
          );
        }

        if (
          !sceneData.scenes ||
          sceneData.scenes.length !== 6
        ) {
          throw new Error(
            "The AI did not create exactly 6 scenes."
          );
        }

        // ==========================================
        // STEP 2 — CREATE RUNWAY VIDEOS
        // ==========================================

        result.innerText =
          "🎬 Sending your 6 scenes to Runway...\n\n" +
          "Runway is generating your video clips.";

        const createResponse =
          await fetch(
            "/api/create-short",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                scenes: sceneData.scenes
              })
            }
          );

        const createData =
          await createResponse.json();

        if (!createResponse.ok) {
          throw new Error(
            createData.error ||
            "Could not start Runway."
          );
        }

        const taskIds =
          createData.taskIds ||
          (
            createData.tasks
              ? createData.tasks.map(
                  item => item.taskId
                )
              : []
          );

        if (
          !Array.isArray(taskIds) ||
          taskIds.length !== 6
        ) {
          throw new Error(
            "Runway did not return exactly 6 task IDs."
          );
        }

        // ==========================================
        // STEP 3 — WAIT FOR RUNWAY
        // ==========================================

        let videos = null;

        while (!videos) {

          result.innerText =
            "🎥 Runway is generating your 6 clips...\n\n" +
            "This can take several minutes.\n\n" +
            "Please keep this page open.";

          await sleep(10000);

          const statusResponse =
            await fetch(
              "/api/short-status",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  taskIds: taskIds
                })
              }
            );

          const statusData =
            await statusResponse.json();

          if (!statusResponse.ok) {
            throw new Error(
              statusData.error ||
              "Could not check Runway status."
            );
          }

          if (
            statusData.status === "FAILED"
          ) {
            throw new Error(
              "One or more Runway clips failed."
            );
          }

          if (
            statusData.status === "SUCCEEDED"
          ) {

            videos = statusData.videos;

            if (
              !Array.isArray(videos) ||
              videos.length !== 6 ||
              videos.some(
                video => !video
              )
            ) {
              throw new Error(
                "Runway finished, but some video URLs are missing."
              );
            }
          }
        }

        // ==========================================
        // STEP 4 — STITCH THE 6 VIDEOS
        // ==========================================

        result.innerText =
          "✂️ Combining your 6 clips...\n\n" +
          "Creating your 30-second video.";

        const stitchResponse =
          await fetch(
            "/api/stitch",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                videos: videos
              })
            }
          );

        const stitchData =
          await stitchResponse.json();

        if (!stitchResponse.ok) {
          throw new Error(
            stitchData.error ||
            "Could not start video assembly."
          );
        }

        const renderId =
          stitchData.renderId;

        if (!renderId) {
          throw new Error(
            "Shotstack did not return a render ID."
          );
        }

        // ==========================================
        // STEP 5 — WAIT FOR SHOTSTACK
        // ==========================================

        let finalVideo = null;

        while (!finalVideo) {

          result.innerText =
            "🎞️ Finalizing your 30-second video...\n\n" +
            "Almost there!";

          await sleep(5000);

          const renderResponse =
            await fetch(
              "/api/stitch-status?renderId=" +
              encodeURIComponent(renderId)
            );

          const renderData =
            await renderResponse.json();

          if (!renderResponse.ok) {
            throw new Error(
              renderData.error ||
              "Could not check final video."
            );
          }

          const status =
            String(
              renderData.status || ""
            ).toLowerCase();

          if (
            status === "failed" ||
            status === "error"
          ) {
            throw new Error(
              "Shotstack failed to create the final video."
            );
          }

          if (
            status === "done" &&
            renderData.url
          ) {
            finalVideo =
              renderData.url;
          }
        }

        // ==========================================
        // STEP 6 — SHOW FINAL VIDEO
        // ==========================================

        result.innerHTML = `
          <h2>🎉 Your video is ready!</h2>

          <video
            controls
            autoplay
            playsinline
          >
            <source
              src="${finalVideo}"
              type="video/mp4"
            >
            Your browser does not support video playback.
          </video>

          <p>
            🎬 30-second AI Short completed!
          </p>
        `;

      } catch (error) {

        console.error(error);

        result.innerText =
          "❌ " + error.message;

      } finally {

        button.disabled = false;
      }
    }


    function sleep(milliseconds) {
      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            milliseconds
          )
      );
    }

  </script>

</body>
</html>
